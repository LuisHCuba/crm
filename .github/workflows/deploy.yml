name: Build and Push Docker Images

on:
  push:
    branches:
      - producao

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/luishcuba/lhcx-web

jobs:
  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_HASURA_ADMIN_SECRET=${{ secrets.VITE_HASURA_ADMIN_SECRET }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}

      - name: Tornar imagem pública no GHCR
        continue-on-error: true
        run: |
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          REPO_ID=$(curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" | jq .id)
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/lhcx-web" \
            -d "{\"visibility\":\"public\",\"selected_repository_ids\":[${REPO_ID}]}" \
            && echo "Pacote lhcx-web público." || echo "GHCR permanece privado; produção usa build via Git no Portainer."
