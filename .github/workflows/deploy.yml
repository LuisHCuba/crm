name: Build and Push Docker Images

on:
  push:
    branches:
      - producao

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/luishcuba/lhcx-web

jobs:
  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_HASURA_ADMIN_SECRET=${{ secrets.VITE_HASURA_ADMIN_SECRET }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}

      - name: Tornar imagem pública no GHCR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.packages.setPackageVisibilityForAuthenticatedUser({
              package_type: "container",
              package_name: "lhcx-web",
              visibility: "public",
            });
            console.log("Pacote lhcx-web público.");
