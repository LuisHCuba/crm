services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    image: ghcr.io/luishcuba/lhcx-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://crm.lhcx.tech
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - internal

  web:
    image: ghcr.io/luishcuba/lhcx-web:latest
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - internal
      - crm
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=crm"
      - "traefik.http.routers.lhcx-web.priority=100"
      - "traefik.http.routers.lhcx-web.rule=Host(`crm.lhcx.tech`)"
      - "traefik.http.routers.lhcx-web.entrypoints=websecure"
      - "traefik.http.routers.lhcx-web.tls.certresolver=leresolver"
      - "traefik.http.services.lhcx-web.loadbalancer.server.port=80"

volumes:
  postgres_data:

networks:
  internal:
  crm:
    external: true
