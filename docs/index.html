<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documentação do projeto</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #fff;
      --border: #d8dde4;
      --text: #1c1e21;
      --muted: #65676b;
      --accent: #1877f2;
      --accent-soft: rgba(24, 119, 242, 0.1);
      --font: system-ui, "Segoe UI", Roboto, sans-serif;
      --header-h: 3.5rem;
      --tab-h: 2.75rem;
      --header-offset: 6.5rem;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      font-size: 15px;
      overflow: hidden;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
    }

    .site-header__bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: var(--header-h);
      padding: 0 0.75rem 0 1rem;
      max-width: 100%;
    }

    .site-header__title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      align-items: stretch;
      gap: 0.25rem;
      flex: 1;
      min-width: 0;
      justify-content: flex-end;
    }

    .tabs button {
      flex: 1 1 0;
      min-width: 0;
      max-width: 9rem;
      padding: 0.45rem 0.5rem;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }

    .tabs button:hover {
      color: var(--text);
      background: var(--bg);
    }

    .tabs button[aria-selected="true"] {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: rgba(24, 119, 242, 0.25);
    }

    .tabs button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .doc-panel {
      position: fixed;
      top: var(--header-offset);
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--surface);
    }

    .doc-panel iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .doc-panel[hidden] {
      display: none;
    }

    /* Tab row dentro do header (altura total do header = bar + tabs) */
    .site-header__tabs-row {
      display: flex;
      align-items: stretch;
      min-height: var(--tab-h);
      padding: 0 0.5rem 0.5rem;
      gap: 0.35rem;
    }

    .site-header__tabs-row .tabs {
      width: 100%;
      justify-content: stretch;
    }

    .site-header__tabs-row .tabs button {
      max-width: none;
    }

    @media (max-width: 520px) {
      .site-header__bar {
        flex-wrap: wrap;
        padding-top: 0.5rem;
      }
      .site-header__title {
        width: 100%;
      }
      .tabs {
        width: 100%;
        justify-content: stretch;
      }
      :root {
        --header-h: 4.5rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__bar">
      <h1 class="site-header__title">Documentação do projeto</h1>
    </div>
    <div class="site-header__tabs-row" role="tablist" aria-label="Documentos">
      <div class="tabs">
        <button type="button" role="tab" id="tab-produto" aria-selected="true" aria-controls="panel-produto">Produto</button>
        <button type="button" role="tab" id="tab-tecnica" aria-selected="false" aria-controls="panel-tecnica">Técnica</button>
        <button type="button" role="tab" id="tab-frontend" aria-selected="false" aria-controls="panel-frontend">Frontend</button>
        <button type="button" role="tab" id="tab-telas" aria-selected="false" aria-controls="panel-telas">Telas</button>
      </div>
    </div>
  </header>

  <div class="doc-panel" id="panel-produto" role="tabpanel" aria-labelledby="tab-produto">
    <iframe title="Documentação de produto" src="doc-produto.html"></iframe>
  </div>
  <div class="doc-panel" id="panel-tecnica" role="tabpanel" aria-labelledby="tab-tecnica" hidden>
    <iframe title="Documentação técnica" src="doc-tecnica.html"></iframe>
  </div>
  <div class="doc-panel" id="panel-frontend" role="tabpanel" aria-labelledby="tab-frontend" hidden>
    <iframe title="Documentação de frontend" src="doc-frontend.html"></iframe>
  </div>
  <div class="doc-panel" id="panel-telas" role="tabpanel" aria-labelledby="tab-telas" hidden>
    <iframe title="Mapa de telas" src="telas.md" style="background: var(--surface);"></iframe>
  </div>

  <script>
    (function () {
      var headerEl = document.querySelector('.site-header');
      function syncHeaderOffset() {
        if (headerEl) {
          document.documentElement.style.setProperty('--header-offset', headerEl.offsetHeight + 'px');
        }
      }
      window.addEventListener('resize', syncHeaderOffset);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(syncHeaderOffset);
      }
      syncHeaderOffset();

      var tabs = document.querySelectorAll('[role="tab"]');
      var panels = document.querySelectorAll('[role="tabpanel"]');

      function selectTab(index) {
        tabs.forEach(function (t, i) {
          var on = i === index;
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.tabIndex = on ? 0 : -1;
          panels[i].hidden = !on;
        });
      }

      tabs.forEach(function (tab, i) {
        tab.addEventListener('click', function () {
          selectTab(i);
        });
        tab.addEventListener('keydown', function (e) {
          var next = null;
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (i + 1) % tabs.length;
          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (i - 1 + tabs.length) % tabs.length;
          if (e.key === 'Home') next = 0;
          if (e.key === 'End') next = tabs.length - 1;
          if (next !== null) {
            e.preventDefault();
            tabs[next].focus();
            selectTab(next);
          }
        });
      });

      selectTab(0);
    })();
  </script>
</body>
</html>
